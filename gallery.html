<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>婚紗照 · 泓嘉 & 柔琪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Cormorant+SC:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fbfaf5;font-family:'Noto Serif TC',serif;color:#4a4a3f;min-height:100%}
  a{color:#8a7a56;text-decoration:none}
  a:hover{opacity:.75}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes goldShimmer{0%{background-position:-200% center}100%{background-position:200% center}}
  @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .shimmer{
    background:linear-gradient(90deg,#8a7a56 0%,#c4a373 20%,#f5e2b8 45%,#c4a373 70%,#8a7a56 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:goldShimmer 5s linear infinite;
  }
  .photo-card{animation:fadeUp .8s ease both;overflow:hidden;border-radius:6px;background:#eee;position:relative;cursor:zoom-in;box-shadow:0 20px 40px -24px rgba(120,110,80,.35)}
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
  .photo-card:hover img{transform:scale(1.04)}
  .photo-card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 18px 16px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));font:400 12px/1.5 'Noto Serif TC',serif;letter-spacing:.15em;opacity:0;transition:opacity .3s}
  .photo-card:hover .cap{opacity:1}
  #lightbox{position:fixed;inset:0;background:rgba(15,15,12,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:32px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 40px 80px -20px rgba(0,0,0,.6)}
  #lightbox .close{position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;line-height:1}
</style>
</head>
<body>

<header style="text-align:center;padding:70px 24px 20px;position:relative">
  <a href="index.html" style="position:absolute;top:24px;left:24px;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:#fff;border:1px solid rgba(196,163,115,.4);border-radius:100px;font:400 11px/1 'Cormorant SC',serif;letter-spacing:.3em;color:#8a7a56;box-shadow:0 4px 12px -6px rgba(120,110,80,.2)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    BACK
  </a>

  <div style="font-family:'Cormorant SC',serif;font-size:11px;letter-spacing:.55em;color:#9a8f74;margin-bottom:14px">— OUR WEDDING —</div>
  <div class="shimmer" style="font-family:'Great Vibes',cursive;font-size:72px;line-height:1.2;margin-bottom:8px">Gallery</div>
  <div style="font:400 13px/1 'Noto Serif TC',serif;letter-spacing:.4em;color:#a99a7a;margin-top:8px">婚 紗 寫 真</div>

  <div style="display:flex;align-items:center;gap:14px;margin:26px auto 0;justify-content:center">
    <div style="height:1px;width:36px;background:#c4a373"></div>
    <div style="font:400 12px/1 'Cormorant Garamond',serif;letter-spacing:.32em;color:#8a7a56">泓 嘉 &amp; 柔 琪</div>
    <div style="height:1px;width:36px;background:#c4a373"></div>
  </div>
</header>

<main style="max-width:1200px;margin:0 auto;padding:40px 24px 80px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
    <div class="photo-card" style="aspect-ratio:3/4;animation-delay:0s">
      <img src="assets/photo-1.jpg" alt="婚紗 01" data-full="assets/photo-1.jpg" loading="lazy">
      <div class="cap">初見的那束光 · No.01</div>
    </div>
    <div class="photo-card" style="aspect-ratio:4/3;animation-delay:.1s">
      <img src="assets/photo-2.jpg" alt="婚紗 02" data-full="assets/photo-2.jpg" loading="lazy">
      <div class="cap">在花與海的中間 · No.02</div>
    </div>
    <div class="photo-card" style="aspect-ratio:3/4;animation-delay:.2s">
      <img src="assets/photo-3.jpg" alt="婚紗 03" data-full="assets/photo-3.jpg" loading="lazy">
      <div class="cap">溫柔時光收藏中 · No.03</div>
    </div>
    <div class="photo-card" style="aspect-ratio:4/3;animation-delay:.3s">
      <img src="assets/photo-4.jpg" alt="婚紗 04" data-full="assets/photo-4.jpg" loading="lazy">
      <div class="cap">從此以後皆是你 · No.04</div>
    </div>
  </div>

  <div style="text-align:center;margin-top:60px;color:#a99a7a;font:400 11px/1.8 'Cormorant SC',serif;letter-spacing:.4em">— MORE MEMORIES COMING SOON —</div>
</main>

<footer style="text-align:center;padding:32px 24px 48px;border-top:1px solid rgba(196,163,115,.2);margin-top:40px">
  <div class="shimmer" style="font-family:'Great Vibes',cursive;font-size:36px;line-height:1.2">Thank You</div>
  <div style="font:400 11px/1.8 'Noto Serif TC',serif;color:#9a8f74;letter-spacing:.3em;margin-top:10px">2027 · 01 · 23 · 水 悅 莊 園</div>
</footer>

<div id="lightbox"><button class="close" aria-label="關閉">×</button><img alt=""></div>

<script>
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.photo-card').forEach(card => {
    card.addEventListener('click', () => {
      lbImg.src = card.querySelector('img').dataset.full;
      lb.classList.add('on');
    });
  });
  lb.addEventListener('click', () => lb.classList.remove('on'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
</script>

</body>
</html>
